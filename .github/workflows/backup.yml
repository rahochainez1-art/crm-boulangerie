name: Sauvegarde quotidienne des commandes

on:
  schedule:
    - cron: '0 3 * * *' # 05:00 heure de Paris (été)
  workflow_dispatch:
  # Relance immédiate quand la sauvegarde elle-même est modifiée (pour vérifier qu'elle marche)
  push:
    branches: [main]
    paths: ['.github/workflows/backup.yml', 'scripts/backup-firestore.mjs']

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24 # firebase-admin 14 exige Node 22+

      - run: npm install firebase-admin

      - run: node scripts/backup-firestore.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      - name: Commit la sauvegarde
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          git diff --staged --quiet || git commit -m "backup: commandes du $(date +%Y-%m-%d)"
          git push
